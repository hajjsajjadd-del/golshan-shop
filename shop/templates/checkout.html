{% extends 'base.html' %}
{% block content %}
<h2 class="section-title">تسویه حساب و ثبت سفارش</h2>
<form method="POST" style="background: white; padding: 30px; border-radius: 12px; display: grid; gap: 20px;">
    {% csrf_token %}
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
        <div>
            <label>نام</label>
            <input type="text" name="fname" required style="width: 100%; padding: 12px; margin-top: 5px; border: 1px solid var(--border); border-radius: 8px;">
        </div>
        <div>
            <label>نام خانوادگی</label>
            <input type="text" name="lname" required style="width: 100%; padding: 12px; margin-top: 5px; border: 1px solid var(--border); border-radius: 8px;">
        </div>
    </div>
    <div>
        <label>شماره تماس</label>
        <input type="text" name="phone" required style="width: 100%; padding: 12px; margin-top: 5px; border: 1px solid var(--border); border-radius: 8px;">
    </div>
    <div>
        <label>آدرس دقیق</label>
        <textarea name="address" required rows="3" style="width: 100%; padding: 12px; margin-top: 5px; border: 1px solid var(--border); border-radius: 8px;"></textarea>
    </div>
    
    <div style="font-size: 20px; font-weight: bold; color: var(--navy); margin-top: 10px;">
        مبلغ قابل پرداخت: {{ total }} تومان
    </div>
    
    <button type="submit" class="btn-add" style="font-size: 18px;">ثبت نهایی سفارش</button>
</form>
{% endblock %}
